name: Deploy Penguin to Cluster
on:
  push:
    branches: main
jobs:
  deploy:
    runs-on: [self-hosted, blade1]
    steps:
      - uses: actions/checkout@v5
      - name: Build and deploy to blades
        run: chmod +x deploy.sh && bash ./deploy.sh
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          SRC: ${{ github.workspace }}
